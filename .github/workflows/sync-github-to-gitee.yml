name: sync-github-to-gitee

on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 0:00
  workflow_dispatch:  # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEE_PRIVATE_KEY }}

      - name: Sync from GitHub upstream
        run: |
          git remote add upstream https://github.com/jwoglom/pumpx2.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Sync tags
        run: |
          git fetch upstream --tags
          git push origin --tags
