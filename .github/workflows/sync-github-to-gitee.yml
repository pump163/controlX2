name: sync-github-to-gitee

# 将上游 jwoglom/controlX2 纯镜像同步到 Gitee 中转站。
# 注意：
# 1. schedule 只在仓库默认分支（zh）上生效，本文件必须推送到 fork 的 zh 分支
# 2. fork 仓库的定时任务默认禁用，首次需在 GitHub 仓库 Actions 页面手动 Enable
# 3. 公共仓库 60 天无活动定时任务会被自动禁用，届时可手动 workflow_dispatch 或重新 Enable
on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（北京时间 04:00），错峰避免整点延迟
  workflow_dispatch:      # 支持在 Actions 页面手动触发

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Bare clone upstream from GitHub
        run: |
          set -euo pipefail
          git clone --bare https://github.com/jwoglom/controlX2.git mirror
          cd mirror
          git fetch origin '+refs/heads/*:refs/heads/*' --tags --prune --force

      - name: Push mirror to Gitee
        working-directory: mirror
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/pumppan/control-x2-upstream.git"
          # 只镜像需要的分支与标签，强制覆盖，保持与上游完全一致（纯镜像，不做 merge）
          # GitHub runner 到 Gitee 偶发 SSL timeout，最多重试 3 次，间隔 30s
          push_with_retry() {
            for i in 1 2 3; do
              if git push gitee --force refs/heads/main:refs/heads/main refs/heads/dev:refs/heads/dev \
                 && git push gitee --tags --force; then
                echo "push succeeded on attempt $i"
                return 0
              fi
              echo "push attempt $i failed, retrying in 30s..."
              sleep 30
            done
            echo "ERROR: all 3 push attempts failed"
            return 1
          }
          push_with_retry
