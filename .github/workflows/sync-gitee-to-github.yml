name: Sync from Gitee

# 每天从 Gitee 拉 zh 和 main 分支推到 GitHub
# 本地只推 Gitee 即可，GitHub 由本 workflow 自动同步
on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00 = 北京时间 8:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch from Gitee
        run: |
          git remote add gitee https://gitee.com/pumppan/controlX2-zh.git
          git fetch gitee zh main

      - name: Push to GitHub
        run: |
          git push origin gitee/zh:zh
          git push origin gitee/main:main
